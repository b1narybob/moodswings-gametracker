<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mood Swings">
<meta name="description" content="The polished companion app for the Mood Swings card game: turn tracking, rules-accurate scoring, card reference, and persistent match memory.">
<title>Mood Swings — Game Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg-aurora" aria-hidden="true"></div>

<header id="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><circle cx="11" cy="16" r="7" fill="#7dd3fc"/><circle cx="21" cy="16" r="7" fill="#f472b6" fill-opacity="0.85"/></svg>
    </span>
    <div>
      <h1>Mood Swings</h1>
      <p id="header-sub">Game Assistant</p>
    </div>
  </div>
  <button id="undo-btn" class="icon-btn hidden" title="Undo last action" aria-label="Undo last action">↩</button>
</header>

<main id="view-root">
  <section id="view-setup" class="view"></section>
  <section id="view-match" class="view hidden"></section>
  <section id="view-cards" class="view hidden"></section>
  <section id="view-rules" class="view hidden"></section>
  <section id="view-history" class="view hidden"></section>
</main>

<nav id="tabbar" aria-label="Main navigation">
  <button class="tab active" data-view="setup" aria-label="Setup">
    <span class="tab-icon">◈</span><span class="tab-label">Setup</span>
  </button>
  <button class="tab" data-view="match" aria-label="Match">
    <span class="tab-icon">◎</span><span class="tab-label">Match</span>
    <span id="match-dot" class="tab-dot hidden"></span>
  </button>
  <button class="tab" data-view="cards" aria-label="Cards">
    <span class="tab-icon">▦</span><span class="tab-label">Cards</span>
  </button>
  <button class="tab" data-view="rules" aria-label="Rules">
    <span class="tab-icon">❖</span><span class="tab-label">Rules</span>
  </button>
  <button class="tab" data-view="history" aria-label="History">
    <span class="tab-icon">✦</span><span class="tab-label">History</span>
  </button>
</nav>

<div id="sheet-scrim" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true">
  <div id="sheet-handle" aria-hidden="true"></div>
  <div id="sheet-body"></div>
</div>

<div id="toast-root" aria-live="polite"></div>
<div id="confetti-root" aria-hidden="true"></div>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
